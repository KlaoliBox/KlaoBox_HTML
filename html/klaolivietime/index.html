<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Klaoli — Bộ gõ Hán Việt &amp; Hán Nôm cho Windows</title>
  <link rel="icon" type="image/png" href="klaoli_logo_trans.png">
<style>
  :root {
    --red: #C8102E;
    --red-dark: #9C0B22;
    --ink: #1A2233;
    --ink-soft: #4A5568;
    --paper: #FDFCFB;
    --card: #FFFFFF;
    --line: #E8E2DC;
    --radius: 14px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    font-family: "Segoe UI", "Be Vietnam Pro", "Microsoft YaHei", "Meiryo", "Malgun Gothic", system-ui, sans-serif;
    background: var(--paper);
    color: var(--ink);
    line-height: 1.65;
  }
  .wrap { max-width: 1020px; margin: 0 auto; padding: 0 24px; }

  /* ===== header ===== */
  header {
    border-bottom: 1px solid var(--line);
    background: rgba(253,252,251,.92);
    backdrop-filter: blur(8px);
    position: sticky; top: 0; z-index: 10;
  }
  .nav { display: flex; align-items: center; gap: 14px; padding: 12px 0; }
  .nav img { height: 34px; }
  .nav .name { font-weight: 700; font-size: 18px; letter-spacing: .5px; }
  .nav .tag { color: var(--ink-soft); font-size: 13px; margin-left: 2px; }
  .nav .spacer { flex: 1; }
  .nav a { color: var(--ink-soft); text-decoration: none; font-size: 14px; margin-left: 20px; }
  .nav a:hover { color: var(--red); }
  .langs { display: flex; gap: 4px; margin-left: 18px; }
  .lang-btn {
    border: 1px solid var(--line); background: #fff; color: var(--ink-soft);
    border-radius: 7px; padding: 3px 9px; font-size: 12.5px; cursor: pointer;
    font-family: inherit;
  }
  .lang-btn:hover { border-color: var(--red); color: var(--red); }
  .lang-btn.active { background: var(--red); border-color: var(--red); color: #fff; font-weight: 700; }

  /* ===== hero ===== */
  .hero { display: flex; align-items: center; gap: 48px; padding: 64px 0 56px; }
  .hero-left { flex: 1.2; }
  .hero-right { flex: 1; text-align: center; }
  .hero-right img { max-width: 100%; height: auto; }
  .why-grid { display: flex; gap: 34px; align-items: flex-start; }
  .why-left { flex: 1.35; min-width: 0; }
  .why-right { flex: 1; min-width: 250px; }
  .hero-right video, .why-right video {
    display: block; width: 100%; height: auto;
    border-radius: 14px; border: 1px solid var(--line);
    box-shadow: 0 10px 30px rgba(27,36,48,.12);
    background: #fff;
  }
  .kicker {
    display: inline-block; color: var(--red); font-weight: 700;
    font-size: 13px; letter-spacing: 2px; text-transform: uppercase;
    margin-bottom: 14px;
  }
  h1 { font-size: 38px; line-height: 1.22; font-weight: 800; margin-bottom: 14px; }
  h1 .accent { color: var(--red); }
  .sub { color: var(--ink-soft); font-size: 17px; margin-bottom: 28px; max-width: 540px; }
  .btn-row { display: flex; gap: 14px; flex-wrap: wrap; align-items: center; }
  .btn {
    display: inline-flex; align-items: center; gap: 10px;
    padding: 14px 26px; border-radius: 10px;
    font-size: 16px; font-weight: 700; text-decoration: none;
    transition: all .15s ease;
  }
  .btn-primary { background: var(--red); color: #fff; box-shadow: 0 4px 14px rgba(200,16,46,.30); }
  .btn-primary:hover { background: var(--red-dark); transform: translateY(-1px); }
  .btn-ghost { background: #fff; color: var(--ink); border: 1.5px solid var(--line); }
  .btn-ghost:hover { border-color: var(--red); color: var(--red); }
  .btn svg { width: 18px; height: 18px; fill: currentColor; }
  .meta { color: var(--ink-soft); font-size: 13px; margin-top: 12px; }

  /* ===== sections ===== */
  section { padding: 52px 0; }
  h2 { font-size: 26px; font-weight: 800; margin-bottom: 6px; }
  h2 + .h2sub { color: var(--ink-soft); margin-bottom: 28px; }

  /* ===== why tabs ===== */
  .tabs { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 20px; }
  .tab-btn {
    border: 1.5px solid var(--line); background: #fff; border-radius: 10px;
    padding: 10px 18px; font-size: 14.5px; font-weight: 700; color: var(--ink-soft);
    cursor: pointer; font-family: inherit; transition: all .15s ease;
  }
  .tab-btn:hover { border-color: var(--red); color: var(--red); }
  .tab-btn.active { background: var(--red); border-color: var(--red); color: #fff; }
  .tab-panel {
    display: none; background: var(--card); border: 1px solid var(--line);
    border-radius: var(--radius); padding: 26px 30px;
  }
  .tab-panel.active { display: block; }
  .tab-panel ul { list-style: none; }
  .tab-panel li {
    padding: 10px 0 10px 26px; position: relative;
    color: var(--ink-soft); font-size: 15px; border-bottom: 1px dashed var(--line);
  }
  .tab-panel li:last-child { border-bottom: none; }
  .tab-panel li::before {
    content: ""; position: absolute; left: 4px; top: 19px;
    width: 8px; height: 8px; border-radius: 50%; background: var(--red);
  }
  .tab-panel b { color: var(--ink); }
  .media-row { display: flex; gap: 30px; align-items: flex-start; flex-wrap: wrap; }
  .media-row .txt { flex: 1.3; min-width: 260px; }
  .media-row .pic { flex: 1; min-width: 240px; text-align: center; }
  .media-row .pic img {
    max-width: 100%; max-height: 520px;
    border: 1px solid var(--line); border-radius: 10px;
    box-shadow: 0 3px 12px rgba(26,34,51,.08);
  }
  .media-row .cap { font-size: 12.5px; color: var(--ink-soft); margin-top: 8px; }

  /* ===== contact ===== */
  .contact-grid { display: flex; gap: 34px; align-items: flex-start; flex-wrap: wrap; }
  .contact-grid .qr { flex: none; text-align: center; }
  .contact-grid .qr img {
    width: 210px; border: 1px solid var(--line); border-radius: 10px;
    box-shadow: 0 3px 12px rgba(26,34,51,.08);
  }
  .contact-grid .cap { font-size: 12.5px; color: var(--ink-soft); margin-top: 8px; }
  .clist { list-style: none; flex: 1; min-width: 260px; }
  .clist li {
    display: flex; gap: 16px; align-items: baseline;
    padding: 11px 0; border-bottom: 1px dashed var(--line); font-size: 15px;
  }
  .clist li:last-child { border-bottom: none; }
  .clist b { flex: none; width: 110px; color: var(--ink); }
  .clist span, .clist a { color: var(--ink-soft); text-decoration: none; word-break: break-all; }
  .clist a:hover { color: var(--red); }

  /* ===== credentials ===== */
  .cred-h { font-size: 16px; font-weight: 800; margin: 26px 0 14px; }
  .creds { display: flex; gap: 18px; flex-wrap: wrap; }
  .cred {
    flex: 1; min-width: 250px; display: flex; gap: 14px; align-items: center;
    border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px;
    background: #fff; text-decoration: none; color: var(--ink);
    transition: border-color .15s ease;
  }
  .cred:hover { border-color: var(--red); }
  .cred .pdf-ico {
    flex: none; width: 58px; height: 74px; border: 1.5px solid var(--red);
    border-radius: 6px; color: var(--red); font-weight: 800; font-size: 15px;
    display: flex; align-items: center; justify-content: center; letter-spacing: 1px;
  }
  .cred .thumb { flex: none; width: 58px; height: 74px; object-fit: cover;
                 border: 1px solid var(--line); border-radius: 6px; }
  .cred .t { font-weight: 700; font-size: 13.5px; line-height: 1.4; }
  .cred .s { font-size: 12px; color: var(--red); margin-top: 3px; }

  /* ===== tables ===== */
  table { width: 100%; border-collapse: collapse; background: var(--card);
          border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
  th, td { padding: 13px 18px; text-align: left; font-size: 14.5px; }
  th { background: #F7F3F0; font-weight: 700; border-bottom: 1px solid var(--line); }
  td { border-bottom: 1px solid var(--line); color: var(--ink-soft); }
  tr:last-child td { border-bottom: none; }
  td b { color: var(--ink); }
  kbd {
    display: inline-block; background: #F1EDEA; border: 1px solid #D9D2CB;
    border-bottom-width: 2px; border-radius: 6px;
    padding: 1px 8px; font-size: 12.5px; font-family: Consolas, monospace; color: var(--ink);
  }

  /* ===== steps ===== */
  .steps { counter-reset: step; }
  .step {
    display: flex; gap: 18px; align-items: flex-start;
    padding: 16px 0; border-bottom: 1px dashed var(--line);
  }
  .step:last-child { border-bottom: none; }
  .step::before {
    counter-increment: step; content: counter(step);
    flex: none; width: 34px; height: 34px; border-radius: 50%;
    background: var(--red); color: #fff; font-weight: 800; font-size: 16px;
    display: flex; align-items: center; justify-content: center;
  }
  .step .body { flex: 1; }
  .step .body b { display: block; margin-bottom: 3px; }
  .step .body span { color: var(--ink-soft); font-size: 14.5px; }

  .note {
    background: #FFF7F3; border: 1px solid #F3D9CE; border-radius: var(--radius);
    padding: 16px 20px; font-size: 14px; color: var(--ink-soft); margin-top: 22px;
  }
  .note b { color: var(--red-dark); }

  /* ===== faq ===== */
  details { background: var(--card); border: 1px solid var(--line); border-radius: 10px;
            padding: 14px 20px; margin-bottom: 10px; }
  summary { font-weight: 700; cursor: pointer; font-size: 15px; }
  details p { color: var(--ink-soft); font-size: 14.5px; margin-top: 10px; }

  footer { border-top: 1px solid var(--line); padding: 30px 0 40px; margin-top: 30px;
           color: var(--ink-soft); font-size: 13px; text-align: center; }
  footer a { color: var(--red); text-decoration: none; }

  @media (max-width: 800px) {
    .hero { flex-direction: column-reverse; gap: 28px; padding-top: 40px; }
    h1 { font-size: 28px; }
    .nav a { margin-left: 12px; }
    .nav .tag { display: none; }
    .tab-panel { padding: 20px 18px; }
    .why-grid { flex-direction: column; gap: 22px; }
    .why-right { min-width: 0; }
  }
</style>
</head>

  vi: "Klaoli — Bộ gõ Hán Việt & Hán Nôm cho Windows",
  zh: "Klaoli — 越南语输入法 · 汉喃扩展（Windows）",

  ja: "Klaoli — ベトナム語入力メソッド（漢喃対応・Windows）",

};

function setLang(l) {
  if (!I18N[l]) return;
  var d = I18N[l];
  document.querySelectorAll("[data-i18n]").forEach(function (el) {
    var v = d[el.getAttribute("data-i18n")];
    if (v != null) el.textContent = v;
  });
  document.querySelectorAll("[data-i18n-html]").forEach(function (el) {
    var v = d[el.getAttribute("data-i18n-html")];
    if (v != null) el.innerHTML = v;
  });
  document.documentElement.lang = l;
  document.title = TITLES[l];
  try { localStorage.setItem("klaoli-lang", l); } catch (e) {}
  document.querySelectorAll(".lang-btn").forEach(function (b) {
    b.classList.toggle("active", b.getAttribute("data-lang") === l);
  });
}

function showTab(n) {
  [1, 2, 3].forEach(function (i) {
    document.getElementById("tp" + i).classList.toggle("active", i === n);
    document.getElementById("bt" + i).classList.toggle("active", i === n);
  });
  var demoMap = {
    1: ["klaoli-demo-vn.mp4", "klaoli-demo-poster-vn.png"],
    2: ["klaoli-demo-mixed.mp4", "klaoli-demo-poster-mixed.png"],
    3: ["klaoli-demo-nom.mp4", "klaoli-demo-poster-nom.png"]
  };
  var v = document.getElementById("demoVideo");
  if (v && demoMap[n] && v.getAttribute("src") !== demoMap[n][0]) {
    v.setAttribute("src", demoMap[n][0]);
    v.setAttribute("poster", demoMap[n][1]);
    v.load();
    v.play();
  }
}

(function init() {
  var saved = null;
  try { saved = localStorage.getItem("klaoli-lang"); } catch (e) {}
  var lang = saved;
  if (!lang) {
    var nav = (navigator.language || "vi").toLowerCase();
    if (nav.indexOf("zh-tw") === 0 || nav.indexOf("zh-hk") === 0 || nav.indexOf("zh-mo") === 0 || nav.indexOf("zh-hant") === 0) lang = "zt";
    else if (nav.indexOf("zh") === 0) lang = "zh";
    else if (nav.indexOf("en") === 0) lang = "en";
    else if (nav.indexOf("ja") === 0) lang = "ja";
    else if (nav.indexOf("ko") === 0) lang = "ko";
    else lang = "vi";
  }
  setLang(lang);
  showTab(1);
})();
</script>
